<!doctype html>
<html lang="en"><head><meta charset="UTF-8"/><meta name="viewport" content="width=device-width, initial-scale=1.0"/><meta name="theme-color" content="#f3f1ea"/><meta name="description" content="Parallax: discover science through its stories, puzzles, and theory."/><title>Parallax — A different perspective</title>
